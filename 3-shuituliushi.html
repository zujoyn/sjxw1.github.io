<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>黄河流域水土流失面积逐年收窄（2019-2025）</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0c3b2e 0%, #1a5f4a 50%, #2d8659 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    #main {
      width: 100%;
      max-width: 960px;
      height: 640px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .footer {
      margin-top: 14px;
      color: #b8e6c9;
      font-size: 12px;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div id="main"></div>
  <div class="footer">
    数据来源：黄河流域水土保持公报（2019—2025）｜ 单位：万 km²<br/>
    七年累计减少水土流失面积 2.38 万 km²
  </div>

<script>
var chartDom = document.getElementById('main');
var myChart = echarts.init(chartDom);

// ====== 真实数据（来自 Excel） ======
var raw = [
  { year: 2019, area: 26.42, delta: null },
  { year: 2020, area: 26.27, delta: 0.15 },
  { year: 2021, area: 25.93, delta: 0.34 },
  { year: 2022, area: 25.55, delta: 0.38 },
  { year: 2023, area: 25.11, delta: 0.44 },
  { year: 2024, area: 24.58, delta: 0.53 },
  { year: 2025, area: 24.04, delta: 0.54 }
];

// 绿色渐变：最浅(最上面2019) → 最深(最下面2025)
var palette = ['#9fdcb6', '#7fd3a5', '#5fc994', '#3fbf83', '#2fb073', '#1f9d63', '#0f8a53'];

var funnelData = raw.map(function(item, idx) {
  return {
    value: item.area,
    name: item.year + '年',
    itemStyle: { color: palette[idx] }
  };
});

var option = {
  backgroundColor: 'transparent',
  title: {
    text: '黄河流域水土流失面积逐年收窄',
    subtext: '2019 — 2025（单位：万 km²）',
    left: 'center',
    top: 10,
    textStyle: { color: '#fff', fontSize: 18 },
    subtextStyle: { color: '#b8e6c9', fontSize: 12 }
  },
  tooltip: {
    trigger: 'item',
    formatter: function(p) {
      var idx = p.dataIndex;
      var d = raw[idx];
      var html = '<b>' + d.year + ' 年</b><br/>水土流失面积：' + d.area.toFixed(2) + ' 万 km²';
      if (d.delta) html += '<br/>较上一年减少：' + d.delta.toFixed(2) + ' 万 km²';
      return html;
    }
  },
  toolbox: {
    feature: {
      dataView: { readOnly: false, title: '数据视图' },
      restore: { title: '还原' },
      saveAsImage: { title: '保存图片' }
    },
    iconStyle: { borderColor: '#b8e6c9' },
    top: 15
  },
  legend: {
    data: raw.map(function(d){ return d.year + '年'; }),
    bottom: 10,
    textStyle: { color: '#b8e6c9' }
  },
  series: [
    {
      name: '水土流失面积',
      type: 'funnel',
      left: '10%',
      top: 80,
      bottom: 60,
      width: '80%',
      // 关键：把 min/max 锁在数据区间内，漏斗收窄效果才明显
      min: 23.8,
      max: 26.5,
      minSize: '20%',
      maxSize: '100%',
      sort: 'descending',   // 大→小，2019在最上最宽，2025在最下最窄
      gap: 3,
      label: {
        show: true,
        position: 'inside',
        color: '#0c3b2e',
        fontWeight: 'bold',
        fontSize: 13,
        formatter: function(p) {
          var idx = p.dataIndex;
          var d = raw[idx];
          if (d.delta) {
            return d.year + '年  ' + d.area.toFixed(2) + ' 万km²  (↓' + d.delta.toFixed(2) + ')';
          }
          return d.year + '年  ' + d.area.toFixed(2) + ' 万km²';
        }
      },
      labelLine: { show: false },
      itemStyle: {
        borderColor: '#fff',
        borderWidth: 2
      },
      emphasis: {
        label: { fontSize: 16 }
      },
      data: funnelData
    }
  ]
};

myChart.setOption(option);
window.addEventListener('resize', function(){ myChart.resize(); });
</script>
</body>
</html>
