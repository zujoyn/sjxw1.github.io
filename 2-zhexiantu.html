<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>黄河流域水土保持率变化趋势（2019-2025）</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0c3b2e 0%, #1a5f4a 50%, #2d8659 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    #main {
      width: 100%;
      max-width: 1000px;
      height: 600px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .footer {
      margin-top: 14px;
      color: #b8e6c9;
      font-size: 12px;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div id="main"></div>
  <div class="footer">
    数据来源：黄河流域水土保持公报（2019—2025）｜ 2019年 66.75% → 2025年 69.75%，累计提升 3.00 个百分点<br/>
    提示：可拖动下方滑块或鼠标滚轮缩放、框选查看任意区间
  </div>

<script>
var chartDom = document.getElementById('main');
var myChart = echarts.init(chartDom);

// ====== 真实数据（来自 Excel） ======
// [时间戳(年初), 水土保持率%]
var rawData = [
  [2019, 66.75],
  [2020, 66.94],
  [2021, 67.37],
  [2022, 67.85],
  [2023, 68.40],
  [2024, 69.07],
  [2025, 69.75]
];

// 转成 time 轴需要的毫秒时间戳（每年1月1日）
var data = rawData.map(function(item) {
  return [+new Date(item[0], 0, 1), item[1]];
});

var option = {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'axis',
    position: function (pt) {
      return [pt[0], '10%'];
    },
    formatter: function(params) {
      var p = params[0];
      var year = new Date(p.value[0]).getFullYear();
      return '<b>' + year + ' 年</b><br/>水土保持率：' + p.value[1].toFixed(2) + '%';
    }
  },
  title: {
    left: 'center',
    text: '黄河流域水土保持率变化趋势',
    subtext: '2019 — 2025（单位：%）',
    textStyle: { color: '#fff', fontSize: 18 },
    subtextStyle: { color: '#b8e6c9', fontSize: 12 }
  },
  toolbox: {
    feature: {
      dataZoom: { yAxisIndex: 'none', title: { zoom: '区域缩放', back: '缩放还原' } },
      restore: { title: '还原' },
      saveAsImage: { title: '保存为图片' }
    },
    iconStyle: { borderColor: '#b8e6c9' }
  },
  grid: { left: 60, right: 30, top: 80, bottom: 70 },
  xAxis: {
    type: 'time',
    boundaryGap: false,
    axisLabel: { color: '#b8e6c9', formatter: '{yyyy}' },
    axisLine: { lineStyle: { color: 'rgba(184,230,201,0.3)' } }
  },
  yAxis: {
    type: 'value',
    min: 66.5,
    max: 70.2,
    boundaryGap: [0, '100%'],
    axisLabel: { color: '#b8e6c9', formatter: '{value}%' },
    splitLine: { lineStyle: { color: 'rgba(184,230,201,0.15)' } }
  },
  dataZoom: [
    { type: 'inside', start: 0, end: 100 },
    {
      type: 'slider',
      start: 0,
      end: 100,
      height: 22,
      bottom: 20,
      borderColor: 'rgba(184,230,201,0.3)',
      backgroundColor: 'rgba(255,255,255,0.05)',
      fillerColor: 'rgba(127,224,172,0.25)',
      handleStyle: { color: '#7fe0ac' },
      textStyle: { color: '#b8e6c9' }
    }
  ],
  series: [
    {
      name: '水土保持率',
      type: 'line',
      smooth: true,
      symbol: 'circle',
      symbolSize: 9,
      showSymbol: true,
      lineStyle: { color: '#7fe0ac', width: 3 },
      itemStyle: { color: '#fff', borderColor: '#7fe0ac', borderWidth: 2 },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(127,224,172,0.55)' },
          { offset: 1, color: 'rgba(45,134,89,0.05)' }
        ])
      },
      data: data,
      markPoint: {
        symbolSize: 50,
        label: { color: '#0c3b2e', fontWeight: 'bold', formatter: '{c}%' },
        data: [
          { type: 'min', name: '最低' },
          { type: 'max', name: '最高' }
        ]
      },
      markLine: {
        symbol: 'none',
        lineStyle: { color: '#ffd166', type: 'dashed' },
        label: { color: '#ffd166', formatter: '六年累计 +3.00 个百分点' },
        data: [[{ coord: [+new Date(2019,0,1), 66.75] }, { coord: [+new Date(2025,0,1), 69.75] }]]
      }
    }
  ]
};

myChart.setOption(option);
window.addEventListener('resize', function(){ myChart.resize(); });
</script>
</body>
</html>
